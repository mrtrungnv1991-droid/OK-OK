version: '3.8'

services:
  # 1. FastAPI Backend API Gateway
  api:
    build: .
    container_name: cyberpool_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://cyber_user:cyber_pass_2026@postgres:5432/cyberpool_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=cyberpool_super_secret_jwt_key_2026_production
      - ENVIRONMENT=production
    depends_on:
      - postgres
      - redis

  # 2. PostgreSQL 16 Database
  postgres:
    image: postgres:16-alpine
    container_name: cyberpool_postgres
    restart: always
    environment:
      - POSTGRES_USER=cyber_user
      - POSTGRES_PASSWORD=cyber_pass_2026
      - POSTGRES_DB=cyberpool_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ../database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    ports:
      - "5432:5432"

  # 3. Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: cyberpool_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
