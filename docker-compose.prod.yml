version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cyberpool_app_prod
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgres://${DB_USER:-cyber_user}:${DB_PASSWORD:-cyber_secret_2026}@postgres:5432/${DB_NAME:-cyberpool_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
      - JWT_SECRET=${JWT_SECRET:-cyber_jwt_production_secret_key_long_secure_hash_2026}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: cyberpool_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-cyber_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cyber_secret_2026}
      POSTGRES_DB: ${DB_NAME:-cyberpool_db}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cyber_user} -d ${DB_NAME:-cyberpool_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cyberpool_redis_prod
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret}
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data_prod:
  redis_data_prod:
