version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cyberpool_app_prod
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgres://${DB_USER:-cyber_user}:${DB_PASSWORD:-cyber_secret_2026}@postgres:5432/${DB_NAME:-cyberpool_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
      # CYBERPOOL FIX (P1 #3): JWT_SECRET KHÔNG có giá trị fallback mặc định trong
      # repo. Compose fail NGAY nếu .env không set (syntax :? bắt buộc), thay vì
      # giữ secret công khai cho ai đọc repo cũng tự ký token admin được.
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET phải được đặt trong .env (>=32 ký tự, random)}
      # CYBERPOOL FIX (P1 #4): production fail-closed ở server/services/paymentSystem/
      # security.ts + sourceConnector/encryptionUtils.ts — nếu thiếu ENCRYPTION_KEY /
      # SOURCE_CONNECTOR_SECRET_KEY backend process.exit(1) lúc boot. Truyền rõ vào
      # container (biến .env chỉ có tác dụng nội suy nếu không khai báo environment).
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY phải được đặt trong .env (>=32 ký tự, random)}
      - SOURCE_CONNECTOR_SECRET_KEY=${SOURCE_CONNECTOR_SECRET_KEY:-${ENCRYPTION_KEY}}
      # P1 #5: thư mục dữ liệu bền vững — mount volume để recreate container
      # không mất snapshot (DB snapshot JSON dùng DatabaseStore, KHÔNG nằm trong PostgreSQL)
      - CRYPTOGATE_TRON_ADDRESS=${CRYPTOGATE_TRON_ADDRESS:-}
      - CRYPTOGATE_BSC_ADDRESS=${CRYPTOGATE_BSC_ADDRESS:-}
      - CRYPTOGATE_SOLANA_ADDRESS=${CRYPTOGATE_SOLANA_ADDRESS:-}
      - CRYPTOGATE_LTC_ADDRESS=${CRYPTOGATE_LTC_ADDRESS:-}
    volumes:
      - app_data_prod:/app/server/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: cyberpool_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-cyber_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cyber_secret_2026}
      POSTGRES_DB: ${DB_NAME:-cyberpool_db}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cyber_user} -d ${DB_NAME:-cyberpool_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cyberpool_redis_prod
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret}
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data_prod:
  redis_data_prod:
  app_data_prod: